[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docdrift"
version = "1.0.0"
description = "Find documentation that no longer matches the code: renamed functions, removed options, missing variables and broken links."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
docdrift = "docdrift.cli:main"

[tool.setuptools]
packages = ["docdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
