[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prreview"
version = "1.0.0"
description = "Review a pull request's changes for common risks, and optionally summarise them with Claude."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "anthropic>=0.40"]

[project.scripts]
prreview = "prreview.cli:main"

[tool.setuptools]
packages = ["prreview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
