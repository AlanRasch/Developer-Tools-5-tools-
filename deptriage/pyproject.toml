[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dep-triage"
version = "1.0.0"
description = "Find vulnerable Python dependencies, rank them by real usage, and suggest the smallest safe upgrade."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dep-triage = "deptriage.cli:main"

[tool.setuptools]
packages = ["deptriage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
